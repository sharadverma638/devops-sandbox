
name: Search All Repositories

on:
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest

    steps:
      - name: Search all repositories
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TARGET="https://sharadverma.carrd.co"

          echo "Searching all repositories for: $TARGET"

          gh repo list --limit 1000 --json nameWithOwner \
            --jq '.[].nameWithOwner' > repos.txt

          TOTAL_REPOS=0
          TOTAL_FILES=0

          while IFS= read -r REPO; do
            [ -z "$REPO" ] && continue

            TOTAL_REPOS=$((TOTAL_REPOS + 1))

            TREE=$(gh api \
              "/repos/$REPO/git/trees/HEAD?recursive=1" \
              --jq '.tree[] | select(.type == "blob") | .path' \
              2>/dev/null || true)

            MATCHES=""

            while IFS= read -r FILE; do
              [ -z "$FILE" ] && continue

              CONTENT=$(gh api \
                "/repos/$REPO/contents/$FILE" \
                -H "Accept: application/vnd.github.raw" \
                2>/dev/null || true)

              if printf '%s' "$CONTENT" | grep -Fq "$TARGET"; then
                MATCHES="${MATCHES}  - $FILE"$'\n'
                TOTAL_FILES=$((TOTAL_FILES + 1))
              fi
            done <<< "$TREE"

            if [ -n "$MATCHES" ]; then
              echo ""
              echo "Repository: $REPO"
              printf '%s' "$MATCHES"
            fi

          done < repos.txt

          echo ""
          echo "================================"
          echo "Total repositories scanned: $TOTAL_REPOS"
          echo "Total matching files: $TOTAL_FILES"
          echo "================================"
