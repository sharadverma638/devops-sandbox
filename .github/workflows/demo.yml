# GOAL: TELL REPO NAME AND SAY HELLO.

name: First workflow

on:
  push:
    branches: [main]

    
jobs:

  greet:
    runs-on: ubuntu-latest
    steps:
      - name: say hello
        run: echo "hello bro, first workflow run successfully."
        
  repo-name:
    runs-on: ubuntu-latest
    steps:
      - name: show repo name
        run: echo "the repo name is: ${{ github.event.repository.name }}"
