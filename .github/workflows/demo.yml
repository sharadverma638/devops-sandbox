# goal: create simple workflow to say hello.

# name of workflow
name: First workflow

# when should workflow run
on:
  push:
    branches: [main]

# what workflow does
jobs:
  # name of workflow
  great:
    # where job will run
    runs-on: ubuntu-latest
    # sequence of steps job does
    steps:
      - name: say hello
        run: echo "hello bro, first workflow run successfully."
