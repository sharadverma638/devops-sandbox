name: show secrets

on: 
  workflow_dispatch:

env:
  NAME: sharadverma
  
jobs:
  show_env:
    runs-on: ubuntu-latest
    steps:
      - name: show env text
        run: 'echo "the env is: ${{ env.NAME }}"'
      - name: show secrets
        run: 'echo "one fun secret is ${{ secrets.IMPORTANT_SECRET }}"'
