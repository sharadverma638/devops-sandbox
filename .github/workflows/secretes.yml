name: show secrets

on: 
  workflow_dispatch:
   inputs:
     environment:
       description: select the env you want to select:
       required: true
       default: 'developers'
       type: choice
       options:
         - developers
         - production
         - staging
        

env:
  NAME: sharadverma
  
jobs:
  show_env:
    runs-on: ubuntu-latest
    steps:
      - name: show env text
        run: 'echo "the env is: ${{ env.NAME }}"'
      - name: show secrets
        run: 'echo "one fun secret is ${{ secrets.IMPORTANT_SECRET }}"'
      - name: show variables
        run: 'echo "my github username is ${{ vars.GH_USERNAME }}"'
